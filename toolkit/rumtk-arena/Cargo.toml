[package]
name = "rumtk-arena"
description = "Arena/Bump allocator library to support performance critical portions of the rumtk framework."
version = "0.4.2"
license = "LGPL-3.0"
homepage = "https://github.com/luissantosHCIT/rumtk/tree/main/toolkit/rumtk-arena"
documentation = "https://docs.rs/rumtk-arena"
readme = "README.md"
repository = "https://github.com/luissantosHCIT/rumtk"
keywords = ["rumtk", "healthcare", "allocators", "arena", "bump"]
categories = ["parsing", "science", "parser-implementations"]
edition = "2021"
rust-version = "1.81.0"

[features]
default = []
fast_allocator = ["mimalloc", "libmimalloc-sys"]
fast_global_allocator = ["fast_allocator"]
simd = ["rand/simd_support"]

[dependencies]
mimalloc = {  version = "0.1.52", features = ["default", "extended"], optional = true}
libmimalloc-sys = {  version = "0.1.49",  features = ["extended", "arena"], optional = true }
ahash = { version = "0.8.12", features = ["serde"] }
rand = "0.10.1"
bytecount = {version = "0.6.9", features = ["runtime-dispatch-simd"]}
branches = "0.4.4"
serde = { version = "1.0.228", features = ["derive", "std", "rc"] }
