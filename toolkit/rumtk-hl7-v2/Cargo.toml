[package]
name = "rumtk-hl7-v2"
description = "HL7 V2 Parser and MLLP Implementation to support building interface utilities."
version = "0.11.1"
readme = "README.md"
license = "LGPL-3.0"
homepage = "https://github.com/luissantosHCIT/rumtk/tree/main/toolkit/rumtk-hl7-v2"
documentation = "https://docs.rs/rumtk-hl7-v2"
repository = "https://github.com/luissantosHCIT/rumtk"
keywords = ["rumtk", "healthcare", "hl7", "v2"]
categories = ["parsing", "science", "parser-implementations"]
edition = "2021"
rust-version = "1.81.0"

[dependencies]
phf = "0.13.1"
phf_macros = "0.13.1"
chrono = "0.4.39"
once_cell = "1.20.2"
tokio = { version = "1.45.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
pyo3 = { version = "0.28.3", features = ["default", "auto-initialize", "serde"] }
rumtk-core = { version = "0.17.1", path = "../rumtk-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 3
lto = "fat"
codegen-units = 1

[target.x86_64-pc-windows-msvc]
rustflags = ["-Clink-arg=/STACK:8000000"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-Wl,-z,stack-size=8388608"]

[target.x86_64-apple-darwin]
rustflags = ["-Clink-arg=-Wl,-stack_size,8388608"]
